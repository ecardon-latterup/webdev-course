<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles.css" />
    <title>Unit 4 Capstone | Guess My Number</title>
  </head>
  <body>
   <header></header>
    <main>
      <section id="container">
        <h2 id="timerDisplay">00:00</h2>
        <h1>Guess My Number</h1>
        <h2>Please guess a number between 1 and 100.</h2>
        <button id="begin">Begin!</button>
        <section id="guessContainer" class="hidden">
          <section>
            <input id="guess" />
            <button id="submitGuess">Guess</button>
          </section>
          <h3 id="guessFeedback"></h3>
          <section id="previousGuesses" class="hidden">
            <h4>Previous Guesses</h4>
            <ul id="guesses">

            </ul>
          </section>
        </section>
        <button id="resetBtn" class="hidden">Reset</button>
      </section>
    </main>
    <footer></footer>
    <script src="script.js"></script>
  </body>
</html>
