<!doctype html>
<html lang="en">
  <head>
    <link rel="stylesheet" href="styles.css" />
    <title>Lesson 10 | Styled Buttons & Cards</title>
  </head>
  <body>
    <main>
      <div class="card">
        <img
          src="images/mtn-image.jpg"
